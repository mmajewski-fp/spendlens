name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # scripts/code-review-agent is its own package, excluded from the app's lint
  # because the app's install doesn't provide its dependencies. Type-check it
  # here so it isn't simply unchecked.
  agent:
    name: Code review agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/code-review-agent/package-lock.json
      - run: npm ci
        working-directory: scripts/code-review-agent
      - run: npm run typecheck
        working-directory: scripts/code-review-agent
